<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestor API</title>
    <!-- Sin recursos externos: todo se sirve desde la propia app. ws: solo hace falta para la recarga en desarrollo.
         Las llamadas a las APIs las hará el proceso principal, nunca el renderer: por eso connect-src no se abre. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://localhost:*"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
